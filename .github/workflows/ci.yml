name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test
            script: test
          - name: Lint
            script: lint
          - name: Build
            script: build
          - name: Animal art
            script: art:check

    services:
      redis:
        image: ${{ matrix.script == 'test' && 'redis:7-alpine' || '' }}
        ports:
          - 6379:6379
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.name }}
        run: npm run ${{ matrix.script }}
